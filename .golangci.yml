version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - gocritic
    - godot
    - importas
    - ineffassign
    - intrange
    - iotamixing
    - mirror
    - misspell
    - modernize
    - nakedret
    - nilnesserr
    - noctx
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - revive
    - sloglint
    - testifylint
    - unconvert
    - unused
    - usetesting
  settings:
    govet:
      enable-all: true
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      - linters:
          - exhaustruct
        path: ^.*_test\.go$
      - linters:
          - revive
        path: ^internal/parser/utils/
        text: "var-naming: avoid meaningless package names"
      - linters:
          - revive
        path: ^internal/log/
        text: "var-naming: avoid package names that conflict with Go standard library package names"
      - linters:
          - revive
        path: ^internal/parser/
        text: "var-naming: avoid package names that conflict with Go standard library package names"
issues:
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/cloudflare/pint
