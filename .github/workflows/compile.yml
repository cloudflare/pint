name: Compile

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.ver

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Docker Login
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test releasing binaries
        if: github.event_name == 'pull_request'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean --skip=validate --skip=sign --skip=sbom --skip=publish --snapshot

      - name: Extract release changelog
        if: startsWith(github.ref, 'refs/tags/')
        id: changelog
        uses: sean0x42/markdown-extract@4178293dd16a52514b6cb2c01f4d309d264b2736 # v2
        with:
          file: docs/changelog.md
          pattern: "${{  github.ref_name }}"
          no-print-matched-heading: true

      - name: Write changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir .tmp
          exec 3<<'HERE'
          ${{ steps.changelog.outputs.markdown }}
          HERE
          cat /dev/fd/3 | tee .tmp/changelog.txt

      - name: Release binaries
        if: startsWith(github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean --release-notes=.tmp/changelog.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
